[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
rustls-pemfile = "2"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
